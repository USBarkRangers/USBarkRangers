name: Native catalog checks
on:
  push:
    paths: ['01-code/functions/**', '01-code/ios/BarkRanger/Resources/**', '05-tools/scripts/build-ios-catalog.js', '05-tools/scripts/serve-ios-catalog.js', '05-tools/google-apps-script/catalog-publication/**', '.github/workflows/catalog-checks.yml']
  pull_request:
    paths: ['01-code/functions/**', '01-code/ios/BarkRanger/Resources/**', '05-tools/scripts/build-ios-catalog.js', '05-tools/scripts/serve-ios-catalog.js', '05-tools/google-apps-script/catalog-publication/**', '.github/workflows/catalog-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci --prefix 01-code/functions --ignore-scripts
      - name: Validate source parity and publication failure paths
        run: NODE_ENV=test node --test 01-code/functions/tests/native-catalog.test.js 01-code/functions/tests/catalog-publication-script.test.js
      - name: Rebuild the approved bundle deterministically
        run: |
          node 05-tools/scripts/build-ios-catalog.js
          git diff --exit-code -- 01-code/ios/BarkRanger/Resources/catalog.json 01-code/ios/BarkRanger/Resources/catalog-manifest.json 01-code/ios/BarkRanger/Resources/catalog-provenance.txt
      - name: Retained backend and project boundary checks
        run: |
          npm test --prefix 01-code/functions
          node --test 03-tests/firebase-project-isolation.test.cjs
