name: Native iOS checks

on:
  push:
    paths: ['01-code/ios/**', '01-code/functions-native/**', '06-config/native-ios/**', '05-tools/scripts/seed-native-profile-ui.cjs', '05-tools/scripts/test-ios-accounts.py', 'firebase.native.json', '05-tools/scripts/serve-ios-catalog.js', '.github/workflows/ios-checks.yml']
  pull_request:
    paths: ['01-code/ios/**', '01-code/functions-native/**', '06-config/native-ios/**', '05-tools/scripts/seed-native-profile-ui.cjs', '05-tools/scripts/test-ios-accounts.py', 'firebase.native.json', '05-tools/scripts/serve-ios-catalog.js', '.github/workflows/ios-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: macos-26
    # Native acceptance takes ~29m; the hosted runner's first nine UI cases took
    # 794s versus 328s locally. Budget the complete serial suite, without relaxing test timeouts.
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
      - name: Test domain values
        run: swift test --package-path 01-code/ios/Packages/BarkDomain
      - name: Build app and shell tests
        run: |
          xcodebuild -project 01-code/ios/BarkRanger.xcodeproj -scheme BarkRanger \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/BarkDerivedData" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build-for-testing
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install account emulator dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix 01-code/functions-native --ignore-scripts
      - name: Native SDK and account UI against local emulators
        run: |
          node 05-tools/scripts/serve-ios-catalog.js > "$RUNNER_TEMP/account-catalog.log" 2>&1 &
          BARK_FIXTURE_PID=$!
          trap 'kill "$BARK_FIXTURE_PID"' EXIT
          node_modules/.bin/firebase emulators:exec --config firebase.native.json \
            --project demo-bark-native --only auth,firestore,functions \
            "GCLOUD_PROJECT=demo-bark-native node 05-tools/scripts/seed-native-profile-ui.cjs && \
            python3 05-tools/scripts/test-ios-accounts.py --native-profile --native-trips --native-adventures --products '$RUNNER_TEMP/BarkDerivedData/Build/Products' --destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'"
      - name: Run catalog, discovery and accessibility tests
        run: |
          node 05-tools/scripts/serve-ios-catalog.js > "$RUNNER_TEMP/catalog-fixtures.log" 2>&1 &
          BARK_FIXTURE_PID=$!
          trap 'kill "$BARK_FIXTURE_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/unchanged/manifest.json > /dev/null; then break; fi
            sleep 1
          done
          xcodebuild -project 01-code/ios/BarkRanger.xcodeproj -scheme BarkRanger \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/BarkDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/BarkShell.xcresult" \
            -skip-testing:BarkRangerTests/StoreKitClientTests \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test-without-building
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bark-shell-test-results
          path: |
            ${{ runner.temp }}/BarkShell.xcresult
            ${{ runner.temp }}/BarkAccountChecks-*/Acceptance.xcresult
            ${{ runner.temp }}/account-catalog.log
          if-no-files-found: ignore
          retention-days: 7

  storekit:
    # Same app/test code fails before product loading on 26.5 (SKInternalErrorDomain
    # Code=3, "not installed for development") and passes on 26.1. Keep the full
    # app suite on 26.5; run real StoreKit in this REQUIRED second job, not a skip
    # or mocked replacement. Rejoin the main suite after a verified Apple fix.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install isolated StoreKit simulator runtime
        run: xcodebuild -downloadPlatform iOS -buildVersion 26.1 -architectureVariant arm64
      - name: Real StoreKit purchase, redelivery, restore, renewal and refund
        run: |
          BARK_STOREKIT_DEVICE=$(xcrun simctl create 'Bark StoreKit' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-1)
          xcodebuild -project 01-code/ios/BarkRanger.xcodeproj -scheme BarkRanger \
            -configuration Debug -destination "platform=iOS Simulator,id=$BARK_STOREKIT_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/BarkStoreKit" \
            -resultBundlePath "$RUNNER_TEMP/BarkStoreKit.xcresult" \
            -only-testing:BarkRangerTests/StoreKitClientTests \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Keep StoreKit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bark-storekit-test-results
          path: ${{ runner.temp }}/BarkStoreKit.xcresult
          if-no-files-found: ignore
          retention-days: 7
