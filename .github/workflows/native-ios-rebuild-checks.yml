name: Isolated native iOS backend checks
on:
  push:
    paths: ['01-code/functions-native/**', '01-code/ios/Packages/BarkDomain/**', '06-config/native-ios/**', 'firebase.native.json', '05-tools/scripts/check-native-firebase-project.cjs', '03-tests/native-firebase-project-isolation.test.cjs', '03-tests/native-ci-target.test.cjs', '.github/workflows/ios-checks.yml', '.github/workflows/native-ios-rebuild-checks.yml']
  pull_request:
    paths: ['01-code/functions-native/**', '01-code/ios/Packages/BarkDomain/**', '06-config/native-ios/**', 'firebase.native.json', '05-tools/scripts/check-native-firebase-project.cjs', '03-tests/native-firebase-project-isolation.test.cjs', '03-tests/native-ci-target.test.cjs', '.github/workflows/ios-checks.yml', '.github/workflows/native-ios-rebuild-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --prefix 01-code/functions-native --ignore-scripts
      - name: Verify native deployment isolation
        run: node --test 03-tests/native-firebase-project-isolation.test.cjs 03-tests/native-ci-target.test.cjs
      - name: Native authorization, transactions, bounded reads and transport
        run: >-
          node_modules/.bin/firebase emulators:exec --config firebase.native.json
          --project demo-bark-native --only auth,firestore,functions
          'GCLOUD_PROJECT=demo-bark-native node --test --test-concurrency=1 01-code/functions-native/tests/*.test.cjs 01-code/functions-native/tests/integration/*.test.cjs 01-code/functions-native/tests/transport/*.test.cjs'
